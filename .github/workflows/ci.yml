name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Server tests
        run: python -m unittest discover -s server/tests -v
        env:
          PYTHONPATH: server
      - name: Client tests
        run: python -m unittest discover -s client/tests -v
        env:
          PYTHONPATH: client
      - name: Compile check
        run: |
          python -m py_compile server/gtg_server/*.py server/gtg_server/modem/*.py
          python -m py_compile client/gtg_client/*.py
